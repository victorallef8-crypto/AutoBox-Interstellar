name: AutoBox Android — coleta (teste)
on:
  push:
    branches: [main]
    paths:
      - 'AutoBox_Android/**'
      - '.github/workflows/autobox-android.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: autobox-android
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: 'false'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Validar controlador de coleta
        run: node AutoBox_Android/tests/collector.test.mjs
      - name: Instalar plataforma Android
        run: sdkmanager 'platforms;android-35' 'build-tools;34.0.0'
      - name: Compilar e verificar APK
        working-directory: AutoBox_Android
        run: gradle :app:assembleDebug :app:lintDebug --no-daemon
      - name: Verificar assinatura e publicar versão de teste
        env:
          GH_TOKEN: '${{ github.token }}'
        run: |
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose AutoBox_Android/app/build/outputs/apk/debug/app-debug.apk
          cp AutoBox_Android/app/build/outputs/apk/debug/app-debug.apk AutoBoxV_Coleta_Android_0.1.0_teste.apk
          sha256sum AutoBoxV_Coleta_Android_0.1.0_teste.apk > SHA256SUMS_android.txt
          gh release create android-0.1.0 AutoBoxV_Coleta_Android_0.1.0_teste.apk SHA256SUMS_android.txt --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title 'AutoBoxV Coleta Android 0.1.0 — TESTE' --notes-file AutoBox_Android/RELEASE.md --prerelease --latest=false
      - uses: actions/upload-artifact@v4
        with:
          name: AutoBoxV-Android-Coleta-Teste
          path: AutoBoxV_Coleta_Android_0.1.0_teste.apk
