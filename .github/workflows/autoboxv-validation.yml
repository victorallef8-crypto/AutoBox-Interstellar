name: Validar AutoBoxV (sem publicação)
on:
  push:
    branches: [design/autoboxv-dashboard]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  windows:
    if: github.event_name == 'push' || github.head_ref == 'design/autoboxv-dashboard'
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Dependências
        run: python -m pip install -r AutoBox_Sem_Mouse/requirements.txt pyinstaller==6.22.3
      - name: Testes de interface e lógica
        run: python -m unittest discover -s AutoBox_Sem_Mouse/tests -q
      - name: Ponte de navegação simulada
        run: node AutoBox_Sem_Mouse/tests/test_pursuit_bridge.mjs
      - name: Ponte Skylab simulada
        run: node AutoBox_Sem_Mouse/tests/test_skylab_bridge.mjs
      - name: Ponte de camuflagem simulada
        run: node AutoBox_Sem_Mouse/tests/test_cloak_bridge.mjs
      - name: Empacotar e testar executável (sem release)
        run: python AutoBox_Sem_Mouse/distribution/build_user.py
